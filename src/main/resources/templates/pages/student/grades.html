<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:replace="~{fragments/base :: layout(~{::.content-view}, ~{::#page-scripts})}">

<head>
    <title>My Grades - Smart Campus</title>
</head>

<body>
    <div class="content-view">
        <div class="content-wrapper p-4">
            <!-- Page Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="mb-1">My Grades</h2>
                    <p class="text-muted">Track your academic performance</p>
                </div>
                <div>
                    <button class="btn btn-outline-primary">
                        <i class="bi bi-download me-1"></i>Download Report
                    </button>
                </div>
            </div>

            <!-- Grades Table -->
            <div class="card">
                <div class="card-header border-0 bg-transparent py-3">
                    <h5 class="mb-0 card-title fw-bold text-primary">
                        <i class="bi bi-award me-2"></i>Assessment History
                    </h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4">Quiz / Assessment</th>
                                    <th>Date</th>
                                    <th>Max Marks</th>
                                    <th>Obtained</th>
                                    <th>Status</th>
                                    <th class="text-end pe-4">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${grades == null || #lists.isEmpty(grades)}">
                                    <td colspan="6" class="text-center py-5 text-muted">
                                        <i class="bi bi-clipboard-x fs-1 d-block mb-3"></i>
                                        No grades available yet.
                                    </td>
                                </tr>
                                <tr th:each="g : ${grades}">
                                    <td class="ps-4">
                                        <div class="fw-bold text-dark" th:text="${g.title}">Quiz Title</div>
                                    </td>
                                    <td>
                                        <span class="text-muted"
                                            th:text="${g.date != null ? #temporals.format(g.date,'MMM dd, yyyy') : '-'}">-</span>
                                    </td>
                                    <td>
                                        <span class="badge bg-light text-dark border" th:text="${g.maxMarks}">100</span>
                                    </td>
                                    <td>
                                        <div class="fw-bold"
                                            th:classappend="${g.obtainedMarks != null && g.obtainedMarks >= (g.maxMarks * 0.4) ? 'text-success' : 'text-danger'}"
                                            th:text="${g.obtainedMarks != null ? g.obtainedMarks : '-'}">-</div>
                                    </td>
                                    <td>
                                        <span class="badge rounded-pill"
                                            th:classappend="${g.status == 'COMPLETED' ? 'bg-success' : (g.status == 'PENDING' ? 'bg-warning text-dark' : 'bg-secondary')}"
                                            th:text="${g.status}">COMPLETED</span>
                                    </td>
                                    <td class="text-end pe-4">
                                        <a th:href="@{'/student/grades/' + ${g.quizId}}"
                                            class="btn btn-sm btn-outline-primary">
                                            <i class="bi bi-eye me-1"></i>Details
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block id="page-scripts">
        <script>
            // Page-specific scripts if needed
        </script>
    </th:block>
</body>

</html>
