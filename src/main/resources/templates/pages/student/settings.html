<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:replace="~{fragments/base :: layout(~{::.content-view}, ~{::#page-scripts})}">

<head>
    <title>Settings - Smart Campus</title>
</head>

<body>
    <div class="content-view">
        <div class="content-wrapper p-4">
            <!-- Page Header -->
            <div class="mb-4">
                <h2 class="mb-1">Settings</h2>
                <p class="text-muted">Manage your account preferences and security</p>
            </div>

            <div class="row g-4">
                <!-- Security Settings -->
                <div class="col-lg-6">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white border-0 py-3">
                            <h5 class="mb-0 fw-bold"><i class="bi bi-shield-lock me-2 text-primary"></i>Security</h5>
                        </div>
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-3 pb-3 border-bottom">
                                <div>
                                    <div class="fw-medium">Change Password</div>
                                    <small class="text-muted">Update your account password</small>
                                </div>
                                <a th:href="@{/student/settings/change-password}"
                                    class="btn btn-outline-primary btn-sm">
                                    <i class="bi bi-key me-1"></i>Change
                                </a>
                            </div>
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="fw-medium">Two-Factor Authentication</div>
                                    <small class="text-muted">Add an extra layer of security</small>
                                </div>
                                <span class="badge bg-secondary">Coming Soon</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Notification Settings -->
                <div class="col-lg-6">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white border-0 py-3">
                            <h5 class="mb-0 fw-bold"><i class="bi bi-bell me-2 text-primary"></i>Notifications</h5>
                        </div>
                        <div class="card-body">
                            <div class="form-check form-switch mb-3 pb-3 border-bottom">
                                <input class="form-check-input" type="checkbox" id="emailNotif" checked>
                                <label class="form-check-label" for="emailNotif">
                                    <div class="fw-medium">Email Notifications</div>
                                    <small class="text-muted">Receive updates via email</small>
                                </label>
                            </div>
                            <div class="form-check form-switch mb-3 pb-3 border-bottom">
                                <input class="form-check-input" type="checkbox" id="gradeNotif" checked>
                                <label class="form-check-label" for="gradeNotif">
                                    <div class="fw-medium">Grade Alerts</div>
                                    <small class="text-muted">Get notified when grades are posted</small>
                                </label>
                            </div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="eventNotif" checked>
                                <label class="form-check-label" for="eventNotif">
                                    <div class="fw-medium">Event Reminders</div>
                                    <small class="text-muted">Reminders for campus events</small>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Account Actions -->
                <div class="col-12">
                    <div class="card shadow-sm border-0 border-danger">
                        <div class="card-header bg-white border-0 py-3">
                            <h5 class="mb-0 fw-bold text-danger"><i class="bi bi-exclamation-triangle me-2"></i>Danger
                                Zone</h5>
                        </div>
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="fw-medium">Delete Account</div>
                                    <small class="text-muted">Permanently delete your account and all data</small>
                                </div>
                                <button class="btn btn-outline-danger btn-sm" disabled>
                                    <i class="bi bi-trash me-1"></i>Delete Account
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block id="page-scripts">
        <script>
            // Page-specific scripts if needed
        </script>
    </th:block>
</body>

</html>
