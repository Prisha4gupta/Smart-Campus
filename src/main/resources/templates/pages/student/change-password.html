<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:replace="~{fragments/base :: layout(~{::.content-view}, ~{::#page-scripts})}">

<head>
    <title>Change Password - Smart Campus</title>
</head>

<body>
    <div class="content-view">
        <div class="content-wrapper p-4">
            <!-- Back Button -->
            <div class="mb-4">
                <a th:href="@{/student/settings}" class="text-decoration-none text-muted">
                    <i class="bi bi-arrow-left me-1"></i>Back to Settings
                </a>
            </div>

            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <!-- Success Alert -->
                    <div th:if="${success}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span th:text="${success}">Password changed successfully</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Error Alert -->
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${error}">Something went wrong</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Change Password Card -->
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white border-0 pt-4 pb-0 text-center">
                            <div class="rounded-circle bg-primary bg-opacity-10 d-inline-flex align-items-center justify-content-center mb-3"
                                style="width: 60px; height: 60px;">
                                <i class="bi bi-shield-lock-fill text-primary fs-4"></i>
                            </div>
                            <h5 class="mb-0 fw-bold">Change Password</h5>
                        </div>
                        <div class="card-body p-4">
                            <form th:action="@{/student/settings/change-password}" method="post">

                                <div class="mb-3">
                                    <label for="currentPassword" class="form-label">Current Password</label>
                                    <input type="password" class="form-control" id="currentPassword"
                                        name="currentPassword" required>
                                </div>

                                <div class="mb-3">
                                    <label for="newPassword" class="form-label">New Password</label>
                                    <input type="password" class="form-control" id="newPassword" name="newPassword"
                                        required minlength="8">
                                    <div class="form-text">Minimum 8 characters</div>
                                </div>

                                <div class="mb-4">
                                    <label for="confirmNewPassword" class="form-label">Confirm New Password</label>
                                    <input type="password" class="form-control" id="confirmNewPassword"
                                        name="confirmNewPassword" required minlength="8">
                                </div>

                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary">Change Password</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block id="page-scripts">
        <script>
            // Page-specific scripts if needed
        </script>
    </th:block>
</body>

</html>
