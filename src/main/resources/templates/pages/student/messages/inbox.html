<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/base :: layout(~{::.content-view}, ~{::#page-scripts})}">

<head>
    <title>Messages - Smart Campus</title>
</head>

<body>
    <div class="content-view">
        <div class="content-wrapper p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="mb-1">Messages</h2>
                    <p class="text-muted">Your conversations and announcements</p>
                </div>
                <a th:href="@{/student/messages/compose}" class="btn btn-primary">
                    <i class="bi bi-plus-lg me-1"></i>New Message
                </a>
            </div>

            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="row">
                <div class="col-lg-8">
                    <div class="card shadow-sm border-0 mb-4">
                        <div class="card-header bg-white d-flex justify-content-between align-items-center">
                            <h5 class="mb-0"><i class="bi bi-chat-left-text me-2 text-primary"></i>Conversations</h5>
                            <span th:if="${unreadCount > 0}" class="badge bg-danger"
                                th:text="${unreadCount + ' unread'}">0 unread</span>
                        </div>
                        <div class="card-body p-0">
                            <div class="list-group list-group-flush">
                                <div th:if="${#lists.isEmpty(conversations)}" class="text-center py-5 text-muted">
                                    <i class="bi bi-chat-dots fs-1 d-block mb-3"></i>
                                    No conversations yet. Start messaging!
                                </div>
                                <a th:each="c : ${conversations}"
                                    th:href="@{/student/messages/chat/{id}(id=${c.otherUserId})}"
                                    class="list-group-item list-group-item-action py-3">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <div class="d-flex align-items-center">
                                            <div class="rounded-circle bg-primary bg-opacity-10 d-flex align-items-center justify-content-center me-3"
                                                style="width: 45px; height: 45px;">
                                                <i class="bi bi-person text-primary fs-5"></i>
                                            </div>
                                            <div>
                                                <div class="fw-medium">
                                                    <span th:text="${c.otherUsername}">User</span>
                                                    <span th:if="${c.otherRole == 'ADMIN'}"
                                                        class="badge bg-danger ms-2">Admin</span>
                                                </div>
                                                <small class="text-muted" th:text="${c.lastMessage}">Last
                                                    message...</small>
                                            </div>
                                        </div>
                                        <div class="text-end">
                                            <small class="text-muted d-block"
                                                th:text="${#temporals.format(c.lastMessageTime, 'MMM dd, HH:mm')}">Jan
                                                1</small>
                                            <span th:if="${c.unreadCount > 0}" class="badge bg-primary rounded-pill"
                                                th:text="${c.unreadCount}">0</span>
                                        </div>
                                    </div>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white">
                            <h5 class="mb-0"><i class="bi bi-megaphone me-2 text-warning"></i>Announcements</h5>
                        </div>
                        <div class="card-body p-0">
                            <div class="list-group list-group-flush" style="max-height: 350px; overflow-y: auto;">
                                <div th:if="${#lists.isEmpty(broadcasts)}" class="text-center py-4 text-muted">
                                    <small>No announcements</small>
                                </div>
                                <div th:each="b : ${broadcasts}" class="list-group-item py-3">
                                    <div class="d-flex justify-content-between">
                                        <small class="text-muted">
                                            <i class="bi bi-shield-check text-danger me-1"></i>
                                            <span th:text="${b.senderUsername}">Admin</span>
                                        </small>
                                        <small class="text-muted" th:text="${#temporals.format(b.sentAt, 'MMM dd')}">Jan
                                            1</small>
                                    </div>
                                    <div class="mt-1" th:text="${b.content}">Broadcast content</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block id="page-scripts">
        <script>
            setTimeout(() => location.reload(), 30000);
        </script>
    </th:block>
</body>

</html>
