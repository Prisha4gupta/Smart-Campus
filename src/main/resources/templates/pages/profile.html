<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:replace="~{fragments/base :: layout(~{::.content-view}, ~{::#page-scripts})}">

<head>
    <title>My Profile - Smart Campus</title>
</head>

<body>
    <div class="content-view">
        <div class="content-wrapper p-4">
            <!-- Page Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="mb-1">My Profile</h2>
                    <p class="text-muted">Manage your personal information</p>
                </div>
                <div>
                    <button class="btn btn-outline-primary" id="editBtn" onclick="toggleEdit()">
                        <i class="bi bi-pencil me-1"></i>Edit Profile
                    </button>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-lg-8">
                    <!-- Personal Information Card -->
                    <div class="card mb-4">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="bi bi-person-circle me-2 text-primary"></i>Personal Information
                            </h5>
                        </div>
                        <div class="card-body">
                            <form id="profileForm">
                                <div class="row mb-3">
                                    <label class="col-sm-3 col-form-label text-muted">Username</label>
                                    <div class="col-sm-9">
                                        <input type="text" class="form-control-plaintext fw-bold" id="username"
                                            th:value="${#authentication.principal.username}" readonly>
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <label class="col-sm-3 col-form-label text-muted">Role</label>
                                    <div class="col-sm-9">
                                        <span class="badge bg-primary rounded-pill mt-2"
                                            th:text="${#authentication.principal.role}">STUDENT</span>
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <label class="col-sm-3 col-form-label text-muted">Email</label>
                                    <div class="col-sm-9">
                                        <input type="email" class="form-control" id="email"
                                            placeholder="user@university.edu" disabled>
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <label class="col-sm-3 col-form-label text-muted">Full Name</label>
                                    <div class="col-sm-9">
                                        <input type="text" class="form-control" id="fullName"
                                            placeholder="Enter your full name" disabled>
                                    </div>
                                </div>
                                <div id="editButtons" style="display: none;">
                                    <div class="mt-4 pt-3 border-top d-flex gap-2 justify-content-end">
                                        <button type="button" class="btn btn-secondary"
                                            onclick="cancelEdit()">Cancel</button>
                                        <button type="button" class="btn btn-primary" onclick="saveProfile()">
                                            <i class="bi bi-check-lg me-1"></i>Save Changes
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Security Card -->
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="bi bi-shield-lock me-2 text-primary"></i>Security</h5>
                        </div>
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="mb-1">Password</h6>
                                    <p class="text-muted small mb-0">Change your account password</p>
                                </div>
                                <a th:href="@{/settings/change-password}" class="btn btn-outline-secondary btn-sm">
                                    Change Password
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <!-- Profile Stats -->
                    <div class="card mb-4">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="bi bi-bar-chart me-2 text-primary"></i>Activity Stats</h5>
                        </div>
                        <div class="card-body">
                            <div class="d-flex justify-content-between mb-3 pb-3 border-bottom">
                                <span class="text-muted">Courses Enrolled</span>
                                <strong class="fs-5" th:text="${enrolledCount != null ? enrolledCount : 0}">0</strong>
                            </div>
                            <div class="d-flex justify-content-between mb-3 pb-3 border-bottom">
                                <span class="text-muted">Events</span>
                                <strong class="fs-5" th:text="${eventsCount != null ? eventsCount : 0}">0</strong>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span class="text-muted">Notifications</span>
                                <strong class="fs-5"
                                    th:text="${notificationCount != null ? notificationCount : 0}">0</strong>
                            </div>
                        </div>
                    </div>

                    <!-- Account Info -->
                    <div class="card bg-light border-0">
                        <div class="card-body">
                            <h6 class="fw-bold mb-3"><i class="bi bi-info-circle me-2"></i>Account Status</h6>
                            <p class="small text-muted mb-1">Member since</p>
                            <p class="mb-3 fw-medium">2025</p>
                            <p class="small text-muted mb-1">Status</p>
                            <p class="mb-0 fw-medium text-success">Active</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block id="page-scripts">
        <script>
            function toggleEdit() {
                ['email', 'fullName'].forEach(id => document.getElementById(id).disabled = false);
                document.getElementById('editButtons').style.display = 'block';
                document.getElementById('editBtn').style.display = 'none';
            }

            function cancelEdit() {
                ['email', 'fullName'].forEach(id => {
                    const el = document.getElementById(id);
                    el.value = el.defaultValue || '';
                    el.disabled = true;
                });
                document.getElementById('editButtons').style.display = 'none';
                document.getElementById('editBtn').style.display = 'block';
            }

            async function saveProfile() {
                window.scaUtils.showToast('Profile updated successfully', 'success');
                cancelEdit();
            }
        </script>
    </th:block>
</body>

</html>
