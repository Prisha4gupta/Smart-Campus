<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Sign Up - Smart Campus Assistant</title>

    <!-- Bootstrap 5.3.0 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #343a40;
            padding: 20px;
        }

        .signup-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 40px;
            max-width: 480px;
            width: 100%;
            border: 1px solid #e9ecef;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .signup-card h2 {
            font-weight: 700;
            color: #212529;
            margin-bottom: 8px;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .signup-subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 32px;
            font-size: 0.95rem;
        }

        .form-label {
            font-size: 0.9rem;
            color: #495057;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-control,
        .form-select {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ced4da;
            font-size: 1rem;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
        }

        .btn-signup {
            background-color: #0d6efd;
            border: none;
            padding: 12px;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 8px;
            transition: all 0.2s;
            box-shadow: 0 2px 4px rgba(13, 110, 253, 0.2);
        }

        .btn-signup:hover {
            background-color: #0b5ed7;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(13, 110, 253, 0.3);
        }

        .logo-icon {
            font-size: 2.5rem;
            color: #0d6efd;
            text-align: center;
            display: block;
            margin-bottom: 20px;
        }

        .password-requirements {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 5px;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e9ecef;
        }

        .divider span {
            padding: 0 12px;
            color: #adb5bd;
            font-size: 0.85rem;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="signup-card">
        <!-- Logo/Icon -->
        <i class="bi bi-person-plus-fill logo-icon"></i>

        <h2>Create Account</h2>
        <p class="signup-subtitle">Join the Smart Campus community</p>

        <!-- Registration Form -->
        <form th:action="@{/register}" th:object="${user}" method="post" id="signupForm">
            <!-- CSRF Token (required by Spring Security) -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <!-- Username Field -->
            <div class="mb-3">
                <label for="username" class="form-label">
                    Username
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" id="username" th:field="*{username}"
                        placeholder="Choose a unique username" required autofocus minlength="3" maxlength="50"
                        autocomplete="username">
                </div>
                <small class="text-muted ms-1" style="font-size: 0.8em;">Min 3 chars, letters & numbers</small>
            </div>

            <!-- Password Field -->
            <div class="mb-3">
                <label for="password" class="form-label">
                    Password
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control border-start-0 ps-0" id="password" th:field="*{password}"
                        placeholder="Create a strong password" required minlength="6" autocomplete="new-password">
                </div>
                <div class="password-requirements">
                    <i class="bi bi-info-circle me-1"></i>At least 6 characters required
                </div>
            </div>

            <!-- Confirm Password Field -->
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">
                    Confirm Password
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i
                            class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control border-start-0 ps-0" id="confirmPassword"
                        name="confirmPassword" placeholder="Re-enter your password" required
                        autocomplete="new-password">
                </div>
                <div id="passwordMismatch" class="text-danger mt-1" style="display: none;">
                    <small><i class="bi bi-exclamation-circle me-1"></i>Passwords do not match</small>
                </div>
            </div>

            <!-- Role Selection -->
            <div class="mb-4">
                <label for="role" class="form-label">
                    I am a...
                </label>
                <select class="form-select" id="role" th:field="*{role}" required>
                    <option value="">-- Select your role --</option>
                    <option value="STUDENT">Student</option>
                    <option value="ADMIN">Administrator / Faculty</option>
                </select>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary btn-signup w-100" id="submitBtn">
                Create Account
            </button>
        </form>

        <!-- Divider -->
        <div class="divider">
            <span>OR</span>
        </div>

        <!-- Login Link -->
        <div class="text-center">
            <a th:href="@{/login}" class="text-decoration-none fw-semibold">
                Already have an account? <span class="text-primary">Sign In</span>
            </a>
        </div>

        <!-- Terms and Conditions -->
        <div class="mt-4 text-center">
            <small class="text-muted">
                By creating an account, you agree to our
                <a href="#" class="text-decoration-none text-muted border-bottom">Terms</a> and
                <a href="#" class="text-decoration-none text-muted border-bottom">Privacy Policy</a>
            </small>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Client-side Validation Script -->
    <script>
        // Password match validation
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');
        const passwordMismatch = document.getElementById('passwordMismatch');
        const submitBtn = document.getElementById('submitBtn');
        const signupForm = document.getElementById('signupForm');

        function validatePasswords() {
            if (confirmPassword.value === '') {
                passwordMismatch.style.display = 'none';
                return true;
            }

            if (password.value !== confirmPassword.value) {
                passwordMismatch.style.display = 'block';
                return false;
            } else {
                passwordMismatch.style.display = 'none';
                return true;
            }
        }

        confirmPassword.addEventListener('input', validatePasswords);
        password.addEventListener('input', validatePasswords);

        // Form submission validation
        signupForm.addEventListener('submit', function (e) {
            if (!validatePasswords()) {
                e.preventDefault();
                alert('Please ensure passwords match before submitting.');
                return false;
            }
        });
    </script>
</body>

</html>
