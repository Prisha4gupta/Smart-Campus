<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Campus Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --royal-blue: #1a56db;
            --royal-blue-dark: #1648b8;
            --royal-blue-light: #e8effc;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-400: #9ca3af;
            --gray-600: #4b5563;
            --gray-800: #1f2937;
        }

        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: var(--gray-50);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--gray-200);
            padding: 40px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            background: var(--royal-blue-light);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .brand-icon i {
            font-size: 28px;
            color: var(--royal-blue);
        }

        .brand-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gray-800);
            margin: 0 0 4px;
        }

        .brand-header p {
            font-size: 0.9rem;
            color: var(--gray-400);
            margin: 0;
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--gray-600);
            margin-bottom: 6px;
        }

        .form-control {
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--gray-200);
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--royal-blue);
            box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.12);
        }

        .form-control::placeholder {
            color: var(--gray-400);
        }

        .input-group-text {
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-right: none;
            border-radius: 10px 0 0 10px;
            color: var(--gray-400);
        }

        .input-group .form-control {
            border-left: none;
            border-radius: 0 10px 10px 0;
        }

        .input-group:focus-within .input-group-text {
            border-color: var(--royal-blue);
        }

        .btn-login {
            background: var(--royal-blue);
            border: none;
            padding: 12px 24px;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 10px;
            width: 100%;
            color: #fff;
            transition: all 0.2s ease;
        }

        .btn-login:hover {
            background: var(--royal-blue-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(26, 86, 219, 0.25);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--gray-200);
        }

        .divider span {
            padding: 0 14px;
            color: var(--gray-400);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .signup-link {
            text-align: center;
            font-size: 0.9rem;
            color: var(--gray-600);
        }

        .signup-link a {
            color: var(--royal-blue);
            font-weight: 600;
            text-decoration: none;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .alert {
            border-radius: 10px;
            font-size: 0.875rem;
            padding: 12px 16px;
            margin-bottom: 20px;
        }

        .footer-text {
            text-align: center;
            margin-top: 24px;
            font-size: 0.8rem;
            color: var(--gray-400);
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="brand-header">
                <div class="brand-icon">
                    <i class="bi bi-mortarboard-fill"></i>
                </div>
                <h1>Smart Campus</h1>
                <p>Sign in to your account</p>
            </div>

            <!-- Error Alert -->
            <div th:if="${param.error}" class="alert alert-danger">
                <i class="bi bi-exclamation-circle me-2"></i>Invalid username or password
            </div>

            <!-- Success Alert -->
            <div th:if="${param.logout}" class="alert alert-success">
                <i class="bi bi-check-circle me-2"></i>You have been logged out successfully
            </div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post">

                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" name="username"
                            placeholder="Enter your username" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password"
                            placeholder="Enter your password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-login">
                    Sign In
                </button>
            </form>

            <div class="divider">
                <span>or</span>
            </div>

            <div class="signup-link">
                Don't have an account? <a th:href="@{/signup}">Create one</a>
            </div>
        </div>

        <div class="footer-text">
            © 2024 Smart Campus Assistant
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
