<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:replace="fragments/base :: layout(~{::.content-view}, ~{::#page-scripts})">

<head>
    <title>Manage Events - Admin</title>
</head>

<body>
    <div class="content-view">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-1"><i class="bi bi-calendar-event me-2"></i>Event Management</h1>
                <p class="text-muted">Create and manage upcoming campus events</p>
            </div>
            <div>
                <a href="/admin/events/create" class="btn btn-success">
                    <i class="bi bi-plus-circle me-1"></i>Create Event
                </a>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-8">
                        <input type="text" class="form-control" id="searchEvent" placeholder="Search events..."
                            onkeyup="filterEvents()">
                    </div>
                    <div class="col-md-4">
                        <select class="form-select" id="eventStatusFilter" onchange="filterEvents()">
                            <option value="">All Statuses</option>
                            <option value="Upcoming">Upcoming</option>
                            <option value="Past">Past</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div id="eventsList">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="text-muted mt-2">Loading events...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block id="page-scripts">
        <script th:src="@{/js/events.js}"></script>
    </th:block>
</body>

</html>
