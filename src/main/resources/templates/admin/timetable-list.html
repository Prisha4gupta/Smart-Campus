<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:replace="fragments/base :: layout(~{::.content-view}, ~{::#page-scripts})">

<head>
    <title>Timetable Entries - Admin</title>
</head>

<body>
    <div class="content-view">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-1"><i class="bi bi-clock-history me-2"></i>Timetable Management</h1>
                <p class="text-muted">Manage class schedules and assignments</p>
            </div>
            <div>
                <a href="/admin/timetable/create" class="btn btn-primary">
                    <i class="bi bi-plus-circle me-1"></i>Add Entry
                </a>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Day</label>
                        <select class="form-select" id="dayFilter" onchange="filterTimetable()">
                            <option value="">All Days</option>
                            <option value="1">Monday</option>
                            <option value="2">Tuesday</option>
                            <option value="3">Wednesday</option>
                            <option value="4">Thursday</option>
                            <option value="5">Friday</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Search</label>
                        <input type="text" class="form-control" id="searchTimetable"
                            placeholder="Search subject or room..." onkeyup="filterTimetable()">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">&nbsp;</label>
                        <button class="btn btn-outline-primary w-100" onclick="loadTimetable()">
                            <i class="bi bi-arrow-clockwise me-1"></i>Refresh
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div id="timetableList">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="text-muted mt-2">Loading timetable entries...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block id="page-scripts">
        <script th:src="@{/js/timetable.js}"></script>
    </th:block>
</body>

</html>
