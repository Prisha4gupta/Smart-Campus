<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:replace="~{fragments/base :: layout(~{::.content-view}, ~{::#page-scripts})}">

<head>
    <title>Create Quiz - Smart Campus</title>
</head>

<body>
    <div class="content-view">
        <div class="content-wrapper p-4">
            <div class="mb-4">
                <a th:href="@{/admin/quizzes}" class="text-decoration-none text-muted">
                    <i class="bi bi-arrow-left me-1"></i>Back to Quizzes
                </a>
            </div>

            <div class="mb-4">
                <h2 class="mb-1">Create New Quiz</h2>
                <p class="text-muted">Add a new quiz to a course offering</p>
            </div>

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="row">
                <div class="col-lg-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-4">
                            <form th:action="@{/admin/quizzes}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                                <div class="mb-3">
                                    <label for="offeringId" class="form-label">Course Offering *</label>
                                    <select class="form-select" id="offeringId" name="offeringId" required>
                                        <option value="">Select a course offering...</option>
                                        <option th:each="o : ${offerings}" th:value="${o.id}"
                                            th:text="${o.course.code + ' - ' + o.course.title + ' (' + o.semester + ')'}">
                                            CS101 - Intro (Fall 2024)
                                        </option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label for="title" class="form-label">Quiz Title *</label>
                                    <input type="text" class="form-control" id="title" name="title" required
                                        placeholder="e.g., Midterm Exam, Quiz 1">
                                </div>

                                <div class="mb-3">
                                    <label for="description" class="form-label">Description</label>
                                    <textarea class="form-control" id="description" name="description" rows="3"
                                        placeholder="Optional description or instructions"></textarea>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="date" class="form-label">Date & Time *</label>
                                        <input type="datetime-local" class="form-control" id="date" name="date"
                                            required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="maxMarks" class="form-label">Max Marks</label>
                                        <input type="number" class="form-control" id="maxMarks" name="maxMarks" min="0"
                                            value="0">
                                        <div class="form-text">Auto-calculated when you add questions</div>
                                    </div>
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-plus-lg me-1"></i>Create Quiz
                                    </button>
                                    <a th:href="@{/admin/quizzes}" class="btn btn-outline-secondary">Cancel</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block id="page-scripts">
        <script>
            document.getElementById('date').min = new Date().toISOString().slice(0, 16);
        </script>
    </th:block>
</body>

</html>
