<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/base :: layout(~{::.content-view}, ~{::#page-scripts})}">

<head>
    <title>Edit Question - Smart Campus</title>
</head>

<body>
    <div class="content-view">
        <div class="content-wrapper p-4">
            <div class="mb-4">
                <a th:href="@{/admin/quizzes/{id}/questions(id=${quiz.id})}" class="text-decoration-none text-muted">
                    <i class="bi bi-arrow-left me-1"></i>Back to Questions
                </a>
            </div>

            <div class="mb-4">
                <h2 class="mb-1">Edit Question</h2>
                <p class="text-muted" th:text="'For quiz: ' + ${quiz.title}">Quiz Title</p>
            </div>

            <div class="row">
                <div class="col-lg-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-4">
                            <form
                                th:action="@{/admin/quizzes/{quizId}/questions/{qId}/update(quizId=${quiz.id}, qId=${question.id})}"
                                method="post">

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="questionNumber" class="form-label">Question Number *</label>
                                        <input type="number" class="form-control" id="questionNumber"
                                            name="questionNumber" required min="1"
                                            th:value="${question.questionNumber}">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="maxMarks" class="form-label">Max Marks *</label>
                                        <input type="number" class="form-control" id="maxMarks" name="maxMarks" required
                                            min="1" th:value="${question.maxMarks}">
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="text" class="form-label">Question Text *</label>
                                    <textarea class="form-control" id="text" name="text" rows="5" required
                                        th:text="${question.text}"></textarea>
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-check-lg me-1"></i>Save Changes
                                    </button>
                                    <a th:href="@{/admin/quizzes/{id}/questions(id=${quiz.id})}"
                                        class="btn btn-outline-secondary">Cancel</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block id="page-scripts">
        <script></script>
    </th:block>
</body>

</html>
