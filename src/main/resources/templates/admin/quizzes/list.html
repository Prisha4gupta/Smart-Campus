<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:replace="~{fragments/base :: layout(~{::.content-view}, ~{::#page-scripts})}">

<head>
    <title>Quiz Management - Smart Campus</title>
</head>

<body>
    <div class="content-view">
        <div class="content-wrapper p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="mb-1">Quiz Management</h2>
                    <p class="text-muted mb-0">Create and manage quizzes for course offerings</p>
                </div>
                <a th:href="@{/admin/quizzes/create}" class="btn btn-primary">
                    <i class="bi bi-plus-lg me-1"></i>New Quiz
                </a>
            </div>

            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4">Title</th>
                                    <th>Course Offering</th>
                                    <th>Date</th>
                                    <th>Max Marks</th>
                                    <th>Questions</th>
                                    <th class="text-end pe-4">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(quizzes)}">
                                    <td colspan="6" class="text-center py-5 text-muted">
                                        <i class="bi bi-clipboard-x fs-1 d-block mb-3"></i>
                                        No quizzes found. Create your first quiz!
                                    </td>
                                </tr>
                                <tr th:each="q : ${quizzes}">
                                    <td class="ps-4">
                                        <div class="fw-bold" th:text="${q.title}">Quiz Title</div>
                                        <small class="text-muted"
                                            th:text="${q.description != null ? #strings.abbreviate(q.description, 50) : '-'}">Description</small>
                                    </td>
                                    <td>
                                        <span th:text="${q.offeringCode + ' - ' + q.offeringTitle}">CS101 - Intro</span>
                                        <br>
                                        <small class="text-muted" th:text="${q.offeringSemester}">Fall 2026</small>
                                    </td>
                                    <td>
                                        <span th:if="${q.date != null}"
                                            th:text="${#temporals.format(q.date, 'MMM dd, yyyy HH:mm')}">Dec 15,
                                            2026</span>
                                        <span th:unless="${q.date != null}">-</span>
                                    </td>
                                    <td>
                                        <span class="badge bg-primary" th:text="${q.maxMarks}">100</span>
                                    </td>
                                    <td>
                                        <span th:text="${q.questionCount}">0</span>
                                    </td>
                                    <td class="text-end pe-4">
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{/admin/quizzes/{id}/questions(id=${q.id})}"
                                                class="btn btn-outline-primary" title="Manage Questions">
                                                <i class="bi bi-list-check"></i>
                                            </a>
                                            <a th:href="@{/admin/quizzes/{id}/attempts(id=${q.id})}"
                                                class="btn btn-outline-info" title="View Attempts">
                                                <i class="bi bi-people"></i>
                                            </a>
                                            <a th:href="@{/admin/quizzes/{id}/edit(id=${q.id})}"
                                                class="btn btn-outline-secondary" title="Edit Quiz">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <form th:action="@{/admin/quizzes/{id}/delete(id=${q.id})}" method="post"
                                                class="d-inline"
                                                onsubmit="return confirm('Delete this quiz and all its questions?')">
                                                <button type="submit" class="btn btn-outline-danger"
                                                    title="Delete Quiz">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block id="page-scripts">
        <script>
        </script>
    </th:block>
</body>

</html>
