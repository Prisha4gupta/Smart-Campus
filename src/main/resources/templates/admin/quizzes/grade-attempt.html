<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/base :: layout(~{::.content-view}, ~{::#page-scripts})}">

<head>
    <title>Grade Attempt - Smart Campus</title>
</head>

<body>
    <div class="content-view">
        <div class="content-wrapper p-4">
            <div class="mb-4">
                <a th:href="@{/admin/quizzes/{id}/attempts(id=${quiz.id})}" class="text-decoration-none text-muted">
                    <i class="bi bi-arrow-left me-1"></i>Back to Attempts
                </a>
            </div>

            <div class="mb-4">
                <h2 class="mb-1">Grade Attempt</h2>
                <p class="text-muted" th:text="'Quiz: ' + ${quiz.title}">Quiz Title</p>
            </div>

            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4" style="width: 80px;">#</th>
                                    <th>Question</th>
                                    <th style="width: 100px;">Max Marks</th>
                                    <th style="width: 150px;">Obtained Marks</th>
                                    <th style="width: 200px;">Comment</th>
                                    <th class="text-end pe-4" style="width: 100px;">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(questions)}">
                                    <td colspan="6" class="text-center py-5 text-muted">
                                        <i class="bi bi-list-ul fs-1 d-block mb-3"></i>
                                        No questions found for this quiz.
                                    </td>
                                </tr>
                                <tr th:each="q : ${questions}">
                                    <td class="ps-4">
                                        <span class="badge bg-secondary" th:text="${q.questionNumber}">1</span>
                                    </td>
                                    <td>
                                        <div th:text="${#strings.abbreviate(q.questionText, 80)}">Question text...</div>
                                    </td>
                                    <td>
                                        <span class="badge bg-primary" th:text="${q.maxMarks}">10</span>
                                    </td>
                                    <td>
                                        <form
                                            th:action="@{/admin/quizzes/{quizId}/attempts/{attemptId}/questions/{qId}/grade(quizId=${quiz.id}, attemptId=${attemptId}, qId=${q.questionId})}"
                                            method="post" class="d-flex align-items-center gap-2"
                                            th:id="'form-' + ${q.questionId}">
                                            <input type="number" class="form-control form-control-sm"
                                                name="obtainedMarks" min="0" th:max="${q.maxMarks}"
                                                th:value="${q.obtainedMarks}" style="width: 80px;" required>
                                    </td>
                                    <td>
                                        <input type="text" class="form-control form-control-sm" name="evaluatorComment"
                                            th:value="${q.evaluatorComment}" placeholder="Optional comment">
                                    </td>
                                    <td class="text-end pe-4">
                                        <button type="submit" class="btn btn-sm btn-primary" title="Save Grade">
                                            <i class="bi bi-check-lg"></i>
                                        </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="card mt-4 border-0 bg-light">
                <div class="card-body">
                    <div class="row text-center">
                        <div class="col-md-4">
                            <div class="h4 mb-0" th:text="${#lists.size(questions)}">0</div>
                            <small class="text-muted">Total Questions</small>
                        </div>
                        <div class="col-md-4">
                            <div class="h4 mb-0" th:text="${quiz.maxMarks}">100</div>
                            <small class="text-muted">Max Marks</small>
                        </div>
                        <div class="col-md-4">
                            <div class="h4 mb-0" th:text="${#lists.size(questions.?[obtainedMarks != null])}">0</div>
                            <small class="text-muted">Graded</small>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-4">
                <a th:href="@{/admin/quizzes/{id}/attempts(id=${quiz.id})}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i>Back to Attempts
                </a>
            </div>
        </div>
    </div>

    <th:block id="page-scripts">
        <script></script>
    </th:block>
</body>

</html>
