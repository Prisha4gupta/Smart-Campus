<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/base :: layout(~{::.content-view}, ~{::#page-scripts})}">

<head>
    <title>Edit Quiz - Smart Campus</title>
</head>

<body>
    <div class="content-view">
        <div class="content-wrapper p-4">
            <div class="mb-4">
                <a th:href="@{/admin/quizzes}" class="text-decoration-none text-muted">
                    <i class="bi bi-arrow-left me-1"></i>Back to Quizzes
                </a>
            </div>

            <div class="mb-4">
                <h2 class="mb-1">Edit Quiz</h2>
                <p class="text-muted">Update quiz details</p>
            </div>

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="row">
                <div class="col-lg-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-4">
                            <form th:action="@{/admin/quizzes/{id}/update(id=${quiz.id})}" method="post">

                                <div class="mb-3">
                                    <label for="offeringId" class="form-label">Course Offering *</label>
                                    <select class="form-select" id="offeringId" name="offeringId" required>
                                        <option value="">Select a course offering...</option>
                                        <option th:each="o : ${offerings}" th:value="${o.id}"
                                            th:selected="${o.id == quiz.offeringId}"
                                            th:text="${o.course.code + ' - ' + o.course.title + ' (' + o.semester + ')'}">
                                            CS101 - Intro (Fall 2026)
                                        </option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label for="title" class="form-label">Quiz Title *</label>
                                    <input type="text" class="form-control" id="title" name="title" required
                                        th:value="${quiz.title}">
                                </div>

                                <div class="mb-3">
                                    <label for="description" class="form-label">Description</label>
                                    <textarea class="form-control" id="description" name="description" rows="3"
                                        th:text="${quiz.description}"></textarea>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="date" class="form-label">Date & Time *</label>
                                        <input type="datetime-local" class="form-control" id="date" name="date" required
                                            th:value="${quiz.date != null ? #temporals.format(quiz.date, 'yyyy-MM-dd''T''HH:mm') : ''}">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="maxMarks" class="form-label">Max Marks</label>
                                        <input type="number" class="form-control" id="maxMarks" name="maxMarks" min="0"
                                            th:value="${quiz.maxMarks}" readonly>
                                        <div class="form-text">Auto-calculated from questions</div>
                                    </div>
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-check-lg me-1"></i>Save Changes
                                    </button>
                                    <a th:href="@{/admin/quizzes/{id}/questions(id=${quiz.id})}"
                                        class="btn btn-outline-info">
                                        <i class="bi bi-list-check me-1"></i>Manage Questions
                                    </a>
                                    <a th:href="@{/admin/quizzes}" class="btn btn-outline-secondary">Cancel</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block id="page-scripts">
        <script></script>
    </th:block>
</body>

</html>
