<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/base :: layout(~{::.content-view}, ~{::#page-scripts})}">

<head>
    <title>Quiz Questions - Smart Campus</title>
</head>

<body>
    <div class="content-view">
        <div class="content-wrapper p-4">
            <div class="mb-4">
                <a th:href="@{/admin/quizzes}" class="text-decoration-none text-muted">
                    <i class="bi bi-arrow-left me-1"></i>Back to Quizzes
                </a>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="mb-1" th:text="${quiz.title}">Quiz Title</h2>
                    <p class="text-muted mb-0">
                        <span th:text="${quiz.offeringCode + ' - ' + quiz.offeringTitle}">CS101</span>
                        <span class="mx-2">•</span>
                        <span>Total: <strong th:text="${quiz.maxMarks}">0</strong> marks</span>
                    </p>
                </div>
                <a th:href="@{/admin/quizzes/{id}/questions/create(id=${quiz.id})}" class="btn btn-primary">
                    <i class="bi bi-plus-lg me-1"></i>Add Question
                </a>
            </div>

            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4" style="width: 80px;">#</th>
                                    <th>Question Text</th>
                                    <th style="width: 120px;">Max Marks</th>
                                    <th class="text-end pe-4" style="width: 150px;">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(questions)}">
                                    <td colspan="4" class="text-center py-5 text-muted">
                                        <i class="bi bi-list-ul fs-1 d-block mb-3"></i>
                                        No questions yet. Add your first question!
                                    </td>
                                </tr>
                                <tr th:each="q : ${questions}">
                                    <td class="ps-4">
                                        <span class="badge bg-secondary" th:text="${q.questionNumber}">1</span>
                                    </td>
                                    <td>
                                        <div th:text="${#strings.abbreviate(q.text, 100)}">Question text...</div>
                                    </td>
                                    <td>
                                        <span class="badge bg-primary" th:text="${q.maxMarks}">10</span>
                                    </td>
                                    <td class="text-end pe-4">
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{/admin/quizzes/{quizId}/questions/{qId}/edit(quizId=${quiz.id}, qId=${q.id})}"
                                                class="btn btn-outline-secondary" title="Edit">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <form
                                                th:action="@{/admin/quizzes/{quizId}/questions/{qId}/delete(quizId=${quiz.id}, qId=${q.id})}"
                                                method="post" class="d-inline"
                                                onsubmit="return confirm('Delete this question?')">
                                                <input type="hidden" th:name="${_csrf.parameterName}"
                                                    th:value="${_csrf.token}" />
                                                <button type="submit" class="btn btn-outline-danger" title="Delete">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="card mt-4 border-0 bg-light">
                <div class="card-body">
                    <div class="row text-center">
                        <div class="col-md-4">
                            <div class="h4 mb-0" th:text="${#lists.size(questions)}">0</div>
                            <small class="text-muted">Total Questions</small>
                        </div>
                        <div class="col-md-4">
                            <div class="h4 mb-0" th:text="${quiz.maxMarks}">0</div>
                            <small class="text-muted">Total Marks</small>
                        </div>
                        <div class="col-md-4">
                            <a th:href="@{/admin/quizzes/{id}/attempts(id=${quiz.id})}"
                                class="btn btn-outline-info btn-sm">
                                <i class="bi bi-people me-1"></i>View Attempts
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block id="page-scripts">
        <script></script>
    </th:block>
</body>

</html>
