<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/base :: layout(~{::.content-view}, ~{::#page-scripts})}">

<head>
    <title>Chat - Admin - Smart Campus</title>
</head>

<body>
    <div class="content-view">
        <div class="content-wrapper p-4">
            <div class="mb-4">
                <a th:href="@{/admin/messages}" class="text-decoration-none text-muted">
                    <i class="bi bi-arrow-left me-1"></i>Back to Messages
                </a>
            </div>

            <div class="d-flex align-items-center mb-4">
                <div class="rounded-circle bg-primary bg-opacity-10 d-flex align-items-center justify-content-center me-3"
                    style="width: 50px; height: 50px;">
                    <i class="bi bi-person text-primary fs-4"></i>
                </div>
                <div>
                    <h4 class="mb-0" th:text="${otherUser.username}">Student</h4>
                    <span class="badge bg-secondary" th:text="${otherUser.role}">STUDENT</span>
                </div>
            </div>

            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body" style="height: 400px; overflow-y: auto;" id="chatBox">
                    <div th:if="${#lists.isEmpty(messages)}" class="text-center text-muted py-5">
                        <i class="bi bi-chat-dots fs-1 d-block mb-3"></i>
                        No messages yet. Start the conversation!
                    </div>
                    <div th:each="m : ${messages}" class="mb-3">
                        <div th:classappend="${m.senderId == currentUserId ? 'text-end' : ''}">
                            <div class="d-inline-block p-3 rounded-3"
                                th:classappend="${m.senderId == currentUserId ? 'bg-primary text-white' : 'bg-light'}"
                                style="max-width: 70%;">
                                <div th:text="${m.content}">Message</div>
                                <small class="opacity-75"
                                    th:text="${#temporals.format(m.sentAt, 'MMM dd, HH:mm')}">Time</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-3">
                    <form th:action="@{/admin/messages/send}" method="post" class="d-flex gap-2">
                        <input type="hidden" name="receiverId" th:value="${otherUser.id}" />
                        <input type="text" class="form-control" name="content" placeholder="Type a message..." required
                            autofocus>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-send"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <th:block id="page-scripts">
        <script>
            document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
            setInterval(() => location.reload(), 5000);
        </script>
    </th:block>
</body>

</html>
