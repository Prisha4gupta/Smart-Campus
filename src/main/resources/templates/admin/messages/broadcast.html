<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/base :: layout(~{::.content-view}, ~{::#page-scripts})}">

<head>
    <title>Broadcast Message - Admin - Smart Campus</title>
</head>

<body>
    <div class="content-view">
        <div class="content-wrapper p-4">
            <div class="mb-4">
                <a th:href="@{/admin/messages}" class="text-decoration-none text-muted">
                    <i class="bi bi-arrow-left me-1"></i>Back to Messages
                </a>
            </div>

            <div class="mb-4">
                <h2 class="mb-1"><i class="bi bi-megaphone me-2 text-warning"></i>Broadcast Message</h2>
                <p class="text-muted">Send a message to all students</p>
            </div>

            <div class="row">
                <div class="col-lg-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-4">
                            <form th:action="@{/admin/messages/broadcast}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                                <div class="mb-4">
                                    <label for="content" class="form-label">Message *</label>
                                    <textarea class="form-control" id="content" name="content" rows="6" required
                                        placeholder="Type your broadcast message here..."></textarea>
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-warning">
                                        <i class="bi bi-megaphone me-1"></i>Send Broadcast
                                    </button>
                                    <a th:href="@{/admin/messages}" class="btn btn-outline-secondary">Cancel</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block id="page-scripts">
        <script></script>
    </th:block>
</body>

</html>
