# ==============================================================
# 1. DATABASE CONNECTION (Aiven Cloud MySQL)
# ==============================================================
# REPLACE [HOST], [PORT], and [PASSWORD] with your Aiven details.
# IMPORTANT: Keep '?sslMode=REQUIRED' at the end for security!
spring.datasource.url=add-your-own

# REPLACE: Usually 'avnadmin'
spring.datasource.username=avnadmin

# REPLACE: The long password string you copied from Aiven
spring.datasource.password=add-your-own

# Tells Spring to use the MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================
# 2. HIBERNATE / DATABASE AUTOMATION
# ==============================================================
# CHANGED FROM 'update' TO 'validate' - Flyway now manages schema
# 'validate': Only validates that entities match the database schema
spring.jpa.hibernate.ddl-auto=validate

# 'true': Prints the SQL queries in the console (Great for debugging).
spring.jpa.show-sql=true

# Dialect is auto-detected for MySQL 8 (no need to specify)
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable open-in-view to prevent database queries during view rendering
spring.jpa.open-in-view=false

# ==============================================================
# 3. FLYWAY MIGRATION SETTINGS
# ==============================================================
# Enable Flyway for database migrations
spring.flyway.enabled=true

# Location of migration scripts
spring.flyway.locations=classpath:db/migration

# Baseline on migrate (allows Flyway to work with existing database)
spring.flyway.baseline-on-migrate=true

# Baseline version (start migrations AFTER this version)
spring.flyway.baseline-version=0

# Validate migrations on startup
spring.flyway.validate-on-migrate=true

# Clean database on validation errors (USE WITH CAUTION - only for development)
# spring.flyway.clean-disabled=false

# ==============================================================
# 4. THYMELEAF (Frontend)
# ==============================================================
# 'false': Disables caching so changes to HTML files show up immediately on refresh.
spring.thymeleaf.cache=false

# ==============================================================
# 5. SERVER SETTINGS
# ==============================================================
# The port your website runs on (http://localhost:8080)
server.port=8080

# Shows detailed error messages in the browser (Helpful for development)
server.error.include-message=always