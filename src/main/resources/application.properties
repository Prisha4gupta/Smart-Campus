# ==============================================================
# 1. DATABASE CONNECTION (Aiven Cloud MySQL)
# ==============================================================
# Set these environment variables before running:
#   DB_URL, DB_USERNAME, DB_PASSWORD
# Or replace the placeholders below with your actual values

# Example for local development:
# spring.datasource.url=jdbc:mysql://localhost:3306/smart_campus
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_campus?sslMode=REQUIRED}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================
# 2. HIBERNATE / DATABASE AUTOMATION
# ==============================================================
# 'update': Hibernate will create tables automatically if they don't exist
# Use 'validate' if you want Flyway to manage schema instead
spring.jpa.hibernate.ddl-auto=update

# Disable Flyway - using Hibernate auto-DDL instead for fresh database
spring.flyway.enabled=false

# 'true': Prints the SQL queries in the console (Great for debugging).
spring.jpa.show-sql=true

# Dialect is auto-detected for MySQL 8 (no need to specify)
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable open-in-view to prevent database queries during view rendering
spring.jpa.open-in-view=false

# ==============================================================
# 3. FLYWAY MIGRATION SETTINGS (DISABLED)
# ==============================================================
# Flyway is disabled - Hibernate ddl-auto=update manages schema
# To re-enable Flyway, set spring.flyway.enabled=true above

# Location of migration scripts
spring.flyway.locations=classpath:db/migration

# Baseline on migrate (allows Flyway to work with existing database)
spring.flyway.baseline-on-migrate=true

# Baseline version (start migrations AFTER this version)
spring.flyway.baseline-version=0

# Validate migrations on startup
spring.flyway.validate-on-migrate=false
spring.flyway.repair-on-migrate=true
spring.flyway.ignore-missing-migrations=true

# Clean database on validation errors (USE WITH CAUTION - only for development)
# spring.flyway.clean-disabled=false

# ==============================================================
# 4. THYMELEAF (Frontend)
# ==============================================================
# 'false': Disables caching so changes to HTML files show up immediately on refresh.
spring.thymeleaf.cache=false

# ==============================================================
# 5. SERVER SETTINGS
# ==============================================================
# The port your website runs on (http://localhost:8080)
server.port=8080

# Shows detailed error messages in the browser (Helpful for development)
server.error.include-message=always

# ==============================================================
# 6. JWT CONFIGURATION
# ==============================================================
# Secret key for JWT signing (Base64 encoded)
# IMPORTANT: In production, use environment variable or secrets manager
jwt.secret=U21hcnRDYW1wdXNTZWNyZXRLZXlGb3JKV1RHZW5lcmF0aW9uMjAyNFNlY3VyZVJhbmRvbVN0cmluZ0Zvclhmb3A=

# JWT token expiration time in milliseconds (24 hours)
jwt.expiration=86400000

# ==============================================================
# 7. SWAGGER/OPENAPI CONFIGURATION
# ==============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ==============================================================
# 8. EMAIL SMTP CONFIGURATION
# ==============================================================
# Enable/disable email sending (set to true when SMTP is configured)
app.email.enabled=false

# Gmail SMTP Configuration (Example)
# To use Gmail: Enable 2FA and create App Password at https://myaccount.google.com/apppasswords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==============================================================
# 9. WEATHER API CONFIGURATION (OpenWeatherMap)
# ==============================================================
# Get your free API key at: https://openweathermap.org/api
# 'demo' key uses mock data (no real API calls)
weather.api.key=4852a3a5b8e3f2fea55af5fff6d78d10
weather.api.url=https://api.openweathermap.org/data/2.5/weather
weather.default.city=Bangalore

# ==============================================================
# 10. FILE UPLOAD CONFIGURATION
# ==============================================================
# Directory to store uploaded files
file.upload-dir=uploads

# Maximum file size (10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

